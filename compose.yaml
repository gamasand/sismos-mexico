services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sismos_db
      MYSQL_USER: sismos_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM sismos LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  recolector:
    build:
      context: .
      dockerfile: recolector/Dockerfile

    environment:
      DB_HOST: mysql
      DB_NAME: sismos_db
      DB_USER: sismos_user
      DB_PASSWORD: ${MYSQL_PASSWORD}

      HISTORICAL_RADIUS_KM: ${HISTORICAL_RADIUS_KM:-250}

    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile

    ports:
      - "127.0.0.1:8051:8050"

    environment:
      DB_HOST: mysql
      DB_NAME: sismos_db
      DB_USER: sismos_user
      DB_PASSWORD: ${MYSQL_PASSWORD}

      HISTORICAL_RADIUS_KM: ${HISTORICAL_RADIUS_KM:-250}

    depends_on:
      mysql:
        condition: service_healthy
      recolector:
        condition: service_completed_successfully


volumes:
  mysql_data:
